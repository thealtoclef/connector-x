[project]
name = "connectorx"
description = "Load data from databases to dataframes, the fastest way."
authors = [{ name = "SFU Database System Lab", email = "dsl.cs.sfu@gmail.com" }]
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
maintainers = [{ name = "Weiyuan Wu", email = "youngw@sfu.ca" }]
keywords = ["read_sql"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Topic :: Software Development :: Build Tools",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Healthcare Industry",
    "Topic :: Scientific/Engineering",
    "Framework :: IPython",
]
dependencies = ["numpy>=2.3"]
dynamic = ["version"]

[project.optional-dependencies]
all = [
    "dask[dataframe]>=2021,<2022",
    "pandas>=2.3",
    "modin>=0.10",
    "polars>=1",
    "pyarrow>=22",
]
dask = [
    "dask[dataframe]>=2021,<2022",
    "pandas>=2.3",
]
modin = [
    "modin>=0.10",
    "pandas>=2.3",
]
pandas = ["pandas>=2.3"]
polars = [
    "pyarrow>=22",
    "polars>=1",
]
pyarrow = ["pyarrow>=22"]

[project.urls]
Homepage = "https://github.com/sfu-db/connector-x"
Repository = "https://github.com/sfu-db/connector-x"
Issues = "https://github.com/sfu-db/connector-x/issues"
Documentation = "https://sfu-db.github.io/connector-x/intro.html"

[dependency-groups]
dev = [
    "black>=21.4b0,<22",
    "contexttimer>=0.3.3,<0.4",
    "dask[dataframe]>=2021.7.0,<2022",
    "docopt>=0.6.2,<0.7",
    "ipython>=7.31.1,<8",
    "maturin>=1.0,<2.0",
    "modin[dask]>=0.10.1",
    "polars>=0.20",
    "pyarrow>=22",
    "pytest>=9,<10",
    "pytest-benchmark>=5.2,<6",
    "testcontainers[oracle-free, clickhouse]>=4.0,<5",
    "psycopg2-binary>=2.9,<3",
    "twine>=3.4.1,<4",
    "clickhouse-sqlalchemy>=0.3.2,<0.4",
]

[tool.uv]
default-groups = "all"

[tool.pytest.ini_options]
minversion = "9.0"
python_functions = "test_* bench_*"
# python_files = check_*.py
# python_classes = Check
# addopts = "-ra -q"
# testpaths = [
#   "tests",
#   "integration",
# ]

[build-system]
build-backend = "maturin"
requires = ["maturin>=1.0,<2.0"]

[tool.maturin]
include = [
    { path = "connectorx/*.so", format = "sdist"},
    { path = "connectorx/*.pyd", format = "sdist"},
    { path = "connectorx/dependencies/", format = "sdist"},
    { path = "LICENSE", format = "sdist"},
]
